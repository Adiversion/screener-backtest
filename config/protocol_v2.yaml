# ============================================================
# protocol_v2.yaml
# Acceptance-After-Expansion (AAE) backtest protocol
# ------------------------------------------------------------
# SINGLE SOURCE OF TRUTH for every threshold in Part A of
# "ai research.txt". The backtest report embeds the SHA256 of the
# canonical form of this file. Any edit here is a NEW protocol
# version and invalidates previously frozen discovery runs.
# ============================================================

version: "2.0"

run:
  # Capital tiers to show cost sensitivity (A6).
  capitals: [1000, 10000, 100000]
  target_net: 0.15          # NET target P&L fraction
  hold_sessions: 15         # time stop, sessions held
  momentum_fail_mfe: 0.05   # if MFE < this by session N ...
  momentum_fail_session: 5  # ... exit at close (flat-rotate)
  gap_skip: 0.03            # skip if Open(E+1) > Close(E)*(1+gap_skip)
  seed: 20261002            # all randomness seeded
  bootstrap_n: 10000

# ---- A4 STATE 0 : BREAKOUT_DAY (D0) ----
state0:
  r_ref: 20                 # reference window; R20 always excludes T
  rvol_min: 2.0
  closing_range_min: 0.60
  retention_min: 0.50
  deliv_pct_rel_min: 1.0    # ignored (flagged) when delivery data absent
  base_range_max: 0.25
  ret2_max: 0.10            # not-already-extended (measured at D0-1)
  extension_max: 2.5        # not-already-extended (measured at D0-1)

# ---- A4 STATE 1 : ACCEPTANCE_HOLD ----
state1:
  window: 5                 # D0+1 .. D0+5
  undercut_atr: 0.5         # Low >= R20(D0) - k*ATR14(D0)

# ---- A4 STATE 2 : ACCEPTED_EXPANSION_TRIGGER (E) ----
state2:
  closing_range_min: 0.5
  stop_distance_max: 0.06   # CANDIDATE if StructuralStop distance <= this

# ---- A5 trap filter thresholds ----
filters:
  disabled: []              # e.g. [F1, F5] to run an ablation
  f1_ret2_max: 0.15
  f2_extension_max: 3.0
  f3_range_window: 5
  f3_closing_range_min: 0.5
  f4_deliv_pct_rel_min: 0.7
  f5_atr_pct_max: 0.05
  f5_atr_pct_min: 0.015
  f7_min_price: 50.0
  f8_min_turnover: 20000000.0   # Rs 2 crore (20d mean Close*Volume proxy)
  f8_window: 20
  f11_lookback: 5

# ---- A6 cost model (delivery/CNC; parameterise per broker) ----
costs:
  brokerage: 0.0
  stt: 0.001                 # both sides
  stamp: 0.00015             # buy only
  exch_txn: 0.0000297        # both sides
  sebi: 0.000001             # both sides
  gst: 0.18                  # on exch_txn + sebi
  dp_charge: 15.93           # flat, per sell
  slippage: 0.001            # per side

# ---- A10 discovery / validation ----
validation:
  discovery_start: "2015-01-01"
  discovery_end: "2020-12-31"
  validation_start: "2021-01-01"
  validation_end: "2026-09-25"   # demo cutoff; nothing after 2026-09-25 15:30 IST
  min_validation_trades: 150

# ---- A10 predeclared sensitivity grid (reported in full, BH-FDR) ----
sensitivity:
  rvol_min: [1.5, 2.0, 2.5]
  closing_range_min: [0.5, 0.6, 0.7]
  retention_min: [0.4, 0.5, 0.6]
  stop_distance_max: [0.05, 0.06, 0.07]
  target_net: [0.10, 0.15, 0.20]

# ---- A5 F6 price-band / surveillance exclusion (needs external lists) ----
universe:
  require_price_band_20: true   # F6 enabled only if band data is available

# ---- Pressure -> Response -> Acceptance (PRA) research block ----
# From the ChatGPT-suggested protocol: event classification + horizon study.
pra:
  reference: 20              # structural reference window (previous-N high)
  retention_strong: 0.60     # high vs weak retention cut
  approach_atr: 0.5          # |Close-R|/ATR threshold for STRUCTURAL_APPROACH
  penetration_min: 0.0       # High must exceed R by > this * ATR
  high_effort_rvol: 2.5
  low_result_atr: 0.5
  low_effort_rvol: 1.0
  high_result_atr: 1.5
  resolution_window: 3       # sessions used to label rejected/accepted/recovered
  horizons: [1, 2, 3, 5]     # forward outcome windows (T+n close-to-close)
  # predeclared ablation ladder (Section 23), not tuned on outcomes
  ablation:
    rvol_min: 1.5
    response_min: 0.5
    retention_min: 0.5
    closing_range_min: 0.5

# ---- Price-Acceptance (PA) state machine ----
# From "Price Acceptance Strategy Origins" (lineage/taxonomy/audit of PRA):
# each session is classified into State A/B/C/D using data through T only.
pa:
  reference: 20              # structural reference R (swing-high window)
  penetration_min: 0.0       # High must exceed R by > this * ATR
  rvol_min: 1.5              # "elevated effort" floor
  accepted_retention: 0.60   # State A retention cut
  accepted_closing_range: 0.50
  rejection_disp_atr: -0.25  # close-vs-R in ATR: above -> State C, below -> State D
  rejection_closing_range: 0.40

# ---- blended stock-quality ranking (scripts/decisions.py) ----
# Every component uses data through the decision bar only. Weights are a frozen
# judgement, NOT fitted to outcomes - changing them is a new experiment.
quality:
  # EVIDENCE-WEIGHTED v2 (2026-10). Weights are set from the cross-sectional
  # information coefficients measured by scripts/validate.py on 108,742
  # breakout events. This is fitting to the sample -- see protocol/quality.py.
  # Components are panel field names; quality.py ranks them cross-sectionally.
  weights:
    atrpct: 0.25          # IC -0.0434, t -7.35  (low volatility)
    prox52: 0.20          # IC +0.0344, t +6.03  (near the 52-week high)
    efficiency: 0.20      # IC +0.0178, t +3.73  (effort per unit participation)
    trend_raw: 0.15       # ret120 +0.0147 net of ret20 -0.0128 (reversal)
    penetration: 0.10     # IC -0.0174, t -3.57  (shallow beats deep)
    turnover20: 0.05      # tradability, not a return signal
    stop_proxy: 0.05      # a normal stop distance
  # `edge` (the recovered_after_rej pattern) is added at a fixed EDGE_WEIGHT
  # in code, not here: it beat the random null once but has never been
  # independently validated, so it must stay small.
  min_turnover20: 50000000.0   # Rs 5 crore 20-day mean
  min_price: 20.0
  min_sessions: 252
  rvol_min: 0.8             # too little interest to act on
  rvol_max: 5.0             # above this is climactic, not accumulation
  trend_min: 0.0            # ret60 and ret120 must both exceed this
  max_risk_to_ref: 0.08     # distance from close back to the reference (only above it)
  min_coverage: 1.0         # every component must be computable to be ranked
  thin_coverage: 0.5        # below this -> INSUFFICIENT, listed separately

# ---- SUFFICIENCY LADDER ----------------------------------------------
# Use the LEAST history that answers the question, escalating only when the
# data cannot support the tier below. 38% of NSE EQ symbols are under 5
# years old and 17% under 1 year, so a single 252-session gate would
# silently discard most of a young universe instead of judging it.
#
# Each tier declares only the factors it can actually compute. Factors that do
# not exist at that tier are dropped and the remaining weights renormalise,
# so a thin name is scored on LESS evidence rather than on padded evidence --
# and the tier used is always reported, never hidden.
#
# FULL is not redefined here: at 252 sessions the main evidence-weighted track
# in protocol/quality.py becomes available and it takes over. One source of
# truth per tier, no duplicated weights.
#
# Every tier below FULL is UNVALIDATED: the information coefficients behind
# these factors were measured on the established universe, not on young
# stocks. There is no young-stock panel to measure them on. Labels say so.
sufficiency:
  fetch_sessions: 90          # pull at most this much on demand
  tiers:
    - {name: RECENT,  min_sessions: 7,  label: PROVISIONAL,    evidence: "volatility and tradability only"}
    - {name: SHORT,   min_sessions: 21, label: SHORT_HISTORY, evidence: "adds participation, effort/result, 20d reversal"}
    - {name: MEDIUM,  min_sessions: 60, label: SHORT_HISTORY, evidence: "adds the 60-session trend"}
    - {name: FULL,    min_sessions: 252, label: HISTORICAL_CANDIDATE, evidence: "the validated evidence-weighted track"}
  factors:
    RECENT:  {atrpct: 0.40, turnover7: 0.35, range_pct: 0.25}
    SHORT:   {atrpct: 0.30, efficiency: 0.25, turnover20: 0.15, reversal20: 0.20, penetration: 0.10}
    MEDIUM:  {atrpct: 0.25, efficiency: 0.25, turnover20: 0.10, reversal20: 0.20, penetration: 0.10, trend60: 0.10}
  common_gates:
    min_turnover20: 50000000.0
    min_price: 20.0
    max_atrpct: 0.075
    min_atrpct: 0.005
# ---- data integrity: split / corporate-action artefact scan -------------
# yfinance auto-adjusts OHLC but does NOT split-adjust volume, so a 1:2 split
# shows up as a flat price with a ~2x volume step. That silently corrupts
# RVOL20, efficiency and every pressure/response feature on that date.
dataqc:
  shift_window: 20            # sessions either side of the candidate boundary
  t_min: 6.0                  # Welch t on log volume; severe because we test
                              # thousands of candidate dates across the universe
  shift_ratio_min: 1.25       # post/pre mean log-volume ratio -> a real step
  persist_ratio_min: 1.15     # and it must STILL be elevated 2 windows later
  max_events_per_symbol: 5    # one split is one event, not forty windows
  gap_atr_max: 3.0            # price must be continuous across the bar
  price_gap_atr_min: 12.0     # an unadjusted price discontinuity (limit ~20%)
  gap_hold_sessions: 5        # the new price level must persist this long

# ---- redundancy control (spec: "CONTROL FOR REDUNDANCY") ---------------
# "Is there information here that simpler models do not already contain?"
# If retention correlates with momentum above `rho_warn`, it is repackaged.
redundancy:
  rho_warn: 0.60              # |spearman| above this = suspicious redundancy
  min_obs: 500                # fewer events -> report INCONCLUSIVE
  controls: [ret60, ret120, prox52, rvol20, atrpct, penetration]
  proposed: [retention, closing_disp, efficiency, closing_range]
  outcome: fwd_ret_5          # forward 5-session return
  market_proxy: ew_ret1       # cross-sectional mean 1-day return = regime

# ---- cross-sectional basket test (spec: "CROSS-SECTIONAL TEST") --------
# Top 5 / 10 / 20 baskets per rebalance date. Never cherry-pick the N.
crosssec:
  tops: [5, 10, 20]
  rebalance: W                # weekly calendar of candidate rebalance dates
  hold_sessions: 20           # basket holding period
  min_eligible: 20            # skip a date with too few candidates
  horizon: 20                 # forward sessions used to score the basket
  scores: [momentum, prox52, breakout, acceptance]
  non_overlapping: true       # only take a basket once the last one finished;
                              # otherwise four overlapping baskets count the
                              # same market move four times
  walk_forward_folds: 5       # contiguous IS/OOS folds for era-dependence
  cost_capital: 10000.0       # account size the flat DP charge is charged to

# ---- multiple-testing control (spec: Benjamini-Hochberg FDR) ----------
inference:
  alpha: 0.05                 # FDR level
  min_n_for_test: 50          # below this, no p-value is claimed

# ---- SINGLE-POSITION ROTATION (scripts/rotate.py) ---------------------
# The deployment shape the engine exists for: investment only, no day
# trading, no derivatives. One stock at a time, 100% of capital in it, exit
# on a fixed profit target or a fixed stop, then move the whole account to
# the next prime candidate. If nothing clears the gates the account stays in
# cash -- a real position, not a gap in the report.
#
# These are separate from `run:` because `run:` describes the event-level
# breakout study. A rotation holding period is measured in weeks, not in the
# 15 sessions the AAE protocol was written around.
rotation:
  target_net: 0.15       # NET profit fraction that triggers the exit
  stop_pct: 0.07         # fixed stop, fraction below the entry fill
  hold_sessions: 60      # ~1 quarter; the "do not get stuck for years" rule
  cooldown_sessions: 5   # do not re-enter a stopped-out name immediately
  picks: [rank, random]  # `random` is the null this mode has to beat

# ---- end-of-day candidate screen (scripts/screen_candidates.py) ----
screen:
  stale_days: 3                # ignore symbols with no session this recent
  organic_rvol_max: 5.0        # contained volume -> "organic" demand
  trap_rvol_min: 8.0           # climactic spike ...
  trap_closing_range_max: 0.45 # ... that also closed weak -> trap risk

# ---- PDF liquidity gate (applies to the PA / M1 / N1-N4 strategies) ----
liquidity:
  min_turnover20: 50000000.0  # >= Rs 5 crore 20-day mean Close*Volume
  min_price: 20.0
  min_sessions: 252           # enough prior history to form the state

# ---- strategy params (tweakable; CLI --set strategies.<name>.<key>=v) ----
strategies:
  vol_breakout:
    rvol_min: 1.5
  trap:
    ret2_min: 0.15
  momentum_top:
    n: 20
  high_52w:
    n: 20
  fip_proxy:
    n: 20
  random:
    n: 2000
  pra_strong_retention:
    retention_min: 0.60
  pra_expansion_attempt:
    rvol_min: 1.5
  m1_momentum_composite:
    n: 20
  n1_eod_momentum:
    gap_min: 0.01
    rvol_min: 1.5
  n2_consolidation_breakout:
    max_band: 0.08
    rvol_min: 1.2
  n3_absorption:
    rvol_min: 2.0
    max_result_atr: 0.5
    near_high: 0.98
  n4_effort_result_discrepancy:
    rvol_min: 2.0
    max_closing_range: 0.35

# ---- candidate ranking key (frozen; not tuned) ----
ranking:
  primary: "stop_distance"        # ascending
  secondary: "deliv_pct_rel_D0"   # descending

red_flags:
  winrate_too_good: 0.65
  expectancy_too_good: 0.05
