name: Deploy reports to GitHub Pages

# Optional: gives you a live dashboard URL you can open on any phone/PC.
# One-time setup (needs to be done once, in the browser):
#   Repo -> Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
on:
  workflow_dispatch:
  push:
    branches:
      - live
  workflow_run:
    workflows: ["Update live reports"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one deployment at a time, never cancel a running one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/live') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout live branch
        uses: actions/checkout@v4
        with:
          ref: live

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4