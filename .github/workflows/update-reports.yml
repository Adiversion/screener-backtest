name: Update live reports

# Runs the whole engine on GitHub's servers - no PC needed.
#  - every day at 19:00 IST (13:30 UTC)
#  - or on demand from the Actions tab / the API ("Run workflow")
on:
  schedule:
    - cron: "30 13 * * *"
  workflow_dispatch:
    inputs:
      full_backtest:
        description: "Run all 29 strategies (slower, ~15 min) instead of the protocol set"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-live-reports
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Refresh Nifty-500 price data
        continue-on-error: true
        run: python scripts/fetch_data.py --source nifty500 --start 2018-01-01 --limit 501

      - name: Refresh delivery data (activates filter F4)
        continue-on-error: true
        run: python scripts/fetch_delivery.py --days 40

      - name: Refresh NSE supplementary annex (board meetings, actions, surveillance)
        continue-on-error: true
        run: python scripts/fetch_nse_annex.py

      # The site scores EVERY listed NSE cash equity, so it needs the wide file,
      # not the 499-name Nifty-500 one. yfinance is the single price source on
      # purpose: NSE bhavcopy prices are RAW, and appending raw bars onto an
      # adjusted series corrupts every price factor. bhavcopy contributes
      # delivery columns only -- see scripts/fetch_universe.py.
      - name: Refresh the full NSE equity universe
        continue-on-error: true
        run: python scripts/fetch_universe.py --years 2 --prices-only

      - name: Backtest
        run: |
          if [ "${{ inputs.full_backtest }}" = "true" ]; then
            python scripts/run_backtest.py --strategies all --capital 1000 --cutoff none --set run.bootstrap_n=2000
          else
            python scripts/run_backtest.py --strategies protocol --capital 1000 --cutoff none --set run.bootstrap_n=2000
          fi

      - name: Validation milestone (data integrity, redundancy, FDR, baskets)
        continue-on-error: true
        run: python scripts/validate.py

      - name: Rank good stocks (blended quality score + evidence)
        continue-on-error: true
        run: python scripts/decisions.py --top 10

      - name: Candidate screen and dashboard
        run: python scripts/screen_candidates.py

      # The static research site: a 0.5 MB index plus one lazily-fetched detail
      # file per symbol, so the search box works on a phone with no backend.
      - name: Build the research site
        continue-on-error: true
        run: python scripts/build_site.py

      - name: Build interactive screener dashboard
        continue-on-error: true
        run: python scripts/build_interactive_dashboard.py

      # Does the ranking actually rank? Measured over every scored observation.
      - name: Verdict audit (deciles vs forward outcomes)
        continue-on-error: true
        run: python scripts/verdict_audit.py

      - name: Run the test suite
        run: python -m unittest discover -s tests -v

      - name: Publish reports to the live branch
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf /tmp/live && mkdir -p /tmp/live
          # the site is the front door: it must land at the repository ROOT of
          # the live branch, not under reports/
          cp -r reports/. /tmp/live/
          if [ -d reports/site ]; then cp -r reports/site/. /tmp/live/; fi
          cd /tmp/live
          git init -q -b live
          git add -A
          git commit -q -m "live reports + site $(date -u +%FT%TZ)"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push --force origin live

      - name: Upload reports as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.run_number }}
          path: reports/
          retention-days: 30