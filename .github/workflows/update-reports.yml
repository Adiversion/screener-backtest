name: Update live reports

# Runs the whole engine on GitHub's servers - no PC needed.
#  - Mon-Fri at 17:05 IST (11:35 UTC) right after market close & Bhavcopy publication
#  - Mon-Fri catch-up at 18:05 IST (12:35 UTC) in case NSE published late
#  - Note: off-minute (:35) bypasses GitHub Actions top-of-hour queue delay
#  - or on demand from the Actions tab / the API ("Run workflow")
on:
  push:
    branches:
      - main
  schedule:
    - cron: "35 11 * * 1-5"
    - cron: "35 12 * * 1-5"
  workflow_dispatch:
    inputs:
      full_backtest:
        description: "Run all 29 strategies (slower, ~15 min) instead of the protocol set"
        type: boolean
        default: false
      refresh_universe:
        description: "Re-fetch 2-year prices via yfinance for full universe (slow / rate-limited)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-live-reports
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      # The full 2-year yfinance scrape is slow and hits Yahoo Finance rate limits
      # on GitHub Actions runners. It is gated to explicit manual dispatch only.
      # Official Bhavcopy EQ append runs afterwards so same-day prices are never lost.
      - name: Refresh the full NSE equity universe (manual dispatch only)
        if: ${{ inputs.refresh_universe == true }}
        continue-on-error: true
        run: python scripts/fetch_universe.py --years 2 --prices-only

      - name: Refresh Nifty-500 price data
        continue-on-error: true
        run: python scripts/fetch_data.py --source nifty500 --start 2018-01-01 --limit 501

      - name: Refresh delivery data (activates filter F4)
        continue-on-error: true
        run: python scripts/fetch_delivery.py --days 40 --append

      - name: Refresh latest bhavcopy EQ prices
        continue-on-error: true
        run: |
          python scripts/fetch_data.py --source bhavdata --days 5 --append data/nse_all_history.parquet
          python scripts/fetch_data.py --source bhavdata --days 5 --append data/universe_history.parquet

      - name: Refresh NSE supplementary annex (board meetings, actions, surveillance)
        continue-on-error: true
        run: python scripts/fetch_nse_annex.py

      - name: Backtest
        run: |
          if [ "${{ inputs.full_backtest }}" = "true" ]; then
            python scripts/run_backtest.py --strategies all --capital 1000 --cutoff none --set run.bootstrap_n=2000
          else
            python scripts/run_backtest.py --strategies protocol --capital 1000 --cutoff none --set run.bootstrap_n=2000
          fi

      - name: Validation milestone (data integrity, redundancy, FDR, baskets)
        continue-on-error: true
        run: python scripts/validate.py

      - name: Rank good stocks (blended quality score + evidence)
        continue-on-error: true
        run: python scripts/decisions.py --top 10 --data data/nse_all_history.parquet

      - name: Candidate screen and dashboard
        run: python scripts/screen_candidates.py --data data/nse_all_history.parquet

      - name: Weekly timeframe confluence screen
        continue-on-error: true
        run: python scripts/screen_weekly.py

      - name: Publish Executive Report to GitHub Summary
        continue-on-error: true
        run: |
          if [ -f reports/DECISIONS.md ]; then
            cat reports/DECISIONS.md >> $GITHUB_STEP_SUMMARY
            echo -e "\n---\n" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f reports/WEEKLY_CONFLUENCE.md ]; then
            cat reports/WEEKLY_CONFLUENCE.md >> $GITHUB_STEP_SUMMARY
          fi

      # The static research site: a 0.5 MB index plus one lazily-fetched detail
      # file per symbol, so the search box works on a phone with no backend.
      - name: Build the research site
        continue-on-error: true
        run: python scripts/build_site.py

      - name: Build interactive screener dashboard
        continue-on-error: true
        run: python scripts/build_interactive_dashboard.py

      # Does the ranking actually rank? Measured over every scored observation.
      - name: Verdict audit (deciles vs forward outcomes)
        continue-on-error: true
        run: python scripts/verdict_audit.py

      - name: Run the test suite
        run: python -m unittest discover -s tests -v

      - name: Publish reports to the live branch
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf /tmp/live && mkdir -p /tmp/live
          # the interactive dashboard is the front door: it lands at the repository ROOT
          cp -r reports/. /tmp/live/
          cd /tmp/live
          git init -q -b live
          git add -A
          git commit -q -m "live reports + site $(date -u +%FT%TZ)"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push --force origin live

      - name: Upload reports as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.run_number }}
          path: reports/
          retention-days: 30

  deploy:
    name: Deploy to GitHub Pages
    needs: update
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout live branch
        uses: actions/checkout@v4
        with:
          ref: live

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4